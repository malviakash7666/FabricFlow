<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="fabricGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" /> <!-- violet-600 -->
      <stop offset="100%" stop-color="#4f46e5" /> <!-- indigo-600 -->
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#7c3aed" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Rounded Base Spool/Fabric card -->
  <rect width="32" height="32" rx="8" fill="url(#fabricGrad)" filter="url(#glow)" />
  
  <!-- Woven threads pattern lines -->
  <path d="M4 10 C 12 7, 20 13, 28 10" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25" />
  <path d="M4 16 C 12 13, 20 19, 28 16" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25" />
  <path d="M4 22 C 12 19, 20 25, 28 22" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25" />
  
  <!-- Bold FF Monogram -->
  <text x="16" y="18" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="900" text-anchor="middle" dominant-baseline="middle" letter-spacing="-0.5">FF</text>
</svg>